[project]
name = "BirdSpotter"
version = "0.1.0"
description = "Select and segment the highest-confidence bird from a webcam stream."
readme = "README.md"
requires-python = "==3.12.13"
dependencies = [
    "loguru==0.7.3",
    "numpy==2.4.2",
    "opencv-python-headless==4.14.0.94",
    "openvino==2026.2.1",
]

[dependency-groups]
dev = [
    "pre-commit==4.6.1",
    "pytest==9.1.1",
    "ruff==0.16.1",
    "ty==0.0.65",
]
export = [
    "nncf==3.2.0",
    "timm==1.0.28",
    "ultralytics==8.4.115",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["birdspotter"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # Conflicts with the formatter
    "CPY001",  # Copyright headers are not required
    "D",       # Public API docstrings are not mandatory
    "EM",      # Inline exception messages are clearer here
    "INP001",  # scripts and tests are intentionally not packages
    "ISC001",  # Conflicts with the formatter
    "PLR2004", # Image dimensions and model shapes use meaningful literals
    "T201",    # This is a console application
    "TC",      # Runtime imports keep annotations straightforward
    "TRY003",  # Exception text is specific and local
    "TRY301",  # Local raises preserve readable control flow
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
